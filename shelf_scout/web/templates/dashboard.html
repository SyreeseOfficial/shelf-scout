{% extends "base.html" %}
{% block title %}shelf-scout dashboard{% endblock %}
{% block body %}
<div id="live">{% include "_status.html" %}</div>
<script>
// Refresh the panels every 5 s; buttons post to /api/<action>, then refresh at once.
async function refresh() {
  try {
    const r = await fetch('/partial/status', {cache: 'no-store'});
    if (r.ok) document.getElementById('live').innerHTML = await r.text();
  } catch (e) { /* service restarting or offline: keep the last view and try again */ }
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-action]');
  if (!b) return;
  b.disabled = true;
  try { await fetch('/api/' + b.dataset.action, {method: 'POST'}); } catch (err) { alert('Could not reach shelf-scout: is it running?'); }
  setTimeout(refresh, 400);
});
setInterval(refresh, 5000);
</script>
{% endblock %}
