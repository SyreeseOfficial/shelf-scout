[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelf-scout"
version = "0.1.0"
description = "Free, local PS5 Pro stock alert tool"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "selectolax",   # the one HTML parser used everywhere
    "fastapi",
    "uvicorn",
    "jinja2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
shelf-scout = "shelf_scout.__main__:main"

[tool.setuptools]
packages = ["shelf_scout", "shelf_scout.notifiers", "shelf_scout.pollers", "shelf_scout.trackers", "shelf_scout.web"]

[tool.setuptools.package-data]
"shelf_scout.notifiers" = ["alarm.wav"]
"shelf_scout.trackers" = ["sale_calendar.json"]
"shelf_scout.web" = ["templates/*.html"]
